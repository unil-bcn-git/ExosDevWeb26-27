<!DOCTYPE html>

    <h1>TEST Console</h1>
    <script>
    
        class basic_tools{
            constructor(name, title){
                this.name = name;
                this.title = title;
                const newDiv = document.createElement("div");
                newDiv.setAttribute("id", this.name);

                // and give it some content
                const newContent = document.createTextNode(this.title);

                // add the text node to the newly created div
                newDiv.appendChild(newContent);

                // add the newly created element and its content into the DOM
                const currentDiv = document.getElementById(this.name);
                document.body.insertBefore(newDiv, currentDiv); 
            } 

            set_text(texte){
                document.getElementById(this.name).innerHTML += `${texte} <br />`;
            }

            set_title(texte){
                document.getElementById(this.name).innerHTML += `<h3>${texte}</h3>`;
            }

            jump_lines(){
                document.getElementById(this.name).innerHTML += `<br /><br />`;
            }

            element_link(){
                return (document.getElementById(this.name))
            }

        }
