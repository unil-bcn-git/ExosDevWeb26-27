 // Affichez dans la console tous les nombres de 1 à 1000
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serie 4 1 1 html</title>
 </head>
 <body>
    <script> 
        for(let i = 1; i <= 1000; i++){
            document.write(`${i} `);
        }
    </script>
 </body>
 </html>
